<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2132 488" role="img" aria-labelledby="trinity-lowering-architecture-title trinity-lowering-architecture-desc">
<title id="trinity-lowering-architecture-title">Trinity lowering Architecture 비교안</title>
<desc id="trinity-lowering-architecture-desc">왼쪽의 IR Reader와 직접 API 호출이 PhysicalPlanBuilder에서 합류하여 계획을 확정하고, 공통 CUDA lowering이 Streamed 또는 Persistent로 분기한 후 오른쪽의 CUDA 생성과 native 실행으로 연결된다. IR Reader와 Builder API의 점선 테두리는 LLM이 담당하는 코드를 나타낸다.</desc>
<defs>
<style>@import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;display=swap");</style>
<marker id="trinity-lowering-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="trinity-lowering-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
<marker id="trinity-lowering-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
<style>
