.name{font-size:12px;font-weight:600}
.tag,.edge-label{font:8px 'Geist Mono',ui-monospace,monospace;fill:#4f5d75}
.legend-label{font-size:10px;font-weight:500;fill:#4f5d75}
.zone-name,.branch-condition{font-size:12px;font-weight:500;fill:#4f5d75}
</style>
</defs>
