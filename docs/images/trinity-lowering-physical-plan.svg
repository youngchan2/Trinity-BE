<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 344" role="img" aria-labelledby="trinity-lowering-physical-plan-title trinity-lowering-physical-plan-desc">
<title id="trinity-lowering-physical-plan-title">PhysicalPlan 구성</title>
<desc id="trinity-lowering-physical-plan-desc">텍스트 IR과 프로그램 직접 구성이 PhysicalPlanBuilder로 합류하고, 등록 검사와 이름·operand 정규화, 구조 검증, ID 정규화를 거쳐 PhysicalPlan을 만든다.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
<marker id="trinity-lowering-physical-plan-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="trinity-lowering-physical-plan-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
<marker id="trinity-lowering-physical-plan-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
<style>
.name{font-family:'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;font-weight:600;fill:#2d3142}
.sub{font-family:'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9px;fill:#4f5d75}
.note{font-family:'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;font-weight:400;fill:#4f5d75}
</style></defs>
