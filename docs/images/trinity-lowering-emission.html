<figcaption>실행 계획을 구성한 뒤 구현 후보를 수집하고, 결합 결과의 추정 성능을 바탕으로 커널을 선택합니다. KernelProviders는 Operation과 Loop를 받아 구현별 요구사항을 반환하고, 원시 커널 본문을 CUDA render에 전달합니다.<br>렌더링과 출력은 플랫폼별로 분리합니다. 외부 글꼴을 불러올 수 없는 환경에서는 로컬 대체 글꼴을 사용합니다.</figcaption>
