<text class="note" x="1048" y="220" text-anchor="start">KernelContext로</text>

<text class="note" x="88" y="418" text-anchor="start">실행 배치 및 KernelBindings 확정</text>
<text class="note" x="40" y="460" text-anchor="start">02  RENDER</text>
<text class="note" x="1048" y="500" text-anchor="start">선택된 명세와 binding 사용</text>
<text class="note" x="1048" y="520" text-anchor="start">Plan 재참조 없음</text>
</svg>
<figcaption>Emit이 CuTeKernelProvider를 호출하면 PointwiseKernel에 위임되고, 결과는 호출 경로의 역순으로 반환됩니다. 위쪽은 후보 수집, 아래쪽은 선택된 명세의 본문 렌더링입니다. Provider의 두 메서드는 구현되어 있으며, 결합·선택과 Emit의 render 호출 연결은 후속 단계입니다.<br>외부 글꼴을 불러올 수 없는 환경에서는 로컬 대체 글꼴을 사용합니다.</figcaption>
