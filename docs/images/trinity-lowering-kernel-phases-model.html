<title id="trinity-lowering-kernel-phases-model-title">Fused expression: Matmul, Add, Softmax kernel composition</title>
<desc id="trinity-lowering-kernel-phases-model-desc">이미 fusion된 softmax(A @ B + bias) 식을 파란 Matmul, 주황 Add, 초록 Softmax Kernel에 대응시킨 설계 예시. 각 Kernel은 prologue, 선택적인 mainloop, epilogue 코드 조각을 제공한다. combine은 같은 행 타일 Scope에 준비 코드를 배치하고 K 반복에는 Matmul mainloop를 넣는다. 반복 후 Matmul 결과 x를 Add 입력에, Add 결과 z를 Softmax 입력에 연결해 하나의 코드 본문을 구성한다. Softmax의 행 최댓값, 지수, 행 합계, 정규화는 Softmax Kernel 내부 구현이다.</desc>

<text x="1128" y="48" class="heading" text-anchor="start" xml:space="preserve">combine</text>
<text x="1128" y="76" class="small" text-anchor="start" xml:space="preserve">공유 타일 Scope · CUDA 의사코드</text>
<rect x="40" y="104" width="376" height="984" rx="4" fill="#fff" stroke="#bfc0c0"/>
<rect x="496" y="104" width="424" height="984" rx="4" fill="#ececec" stroke="#7a8399"/>
<rect x="1128" y="104" width="624" height="984" rx="4" fill="#fff" stroke="#bfc0c0"/>
<text x="64" y="144" class="code" text-anchor="start" xml:space="preserve">Y = softmax(A @ B + bias)</text>
<text x="64" y="204" class="ir" text-anchor="start" xml:space="preserve">(ploop 0 M 16 m</text>
<text x="64" y="238" class="ir" text-anchor="start" xml:space="preserve">  (store Y_m</text>
<rect x="72" y="260" width="320" height="328" rx="4" fill="#eaf1eb" stroke="#8aa28f" data-kernel="softmax"/>
<text x="88" y="292" class="ir" text-anchor="start" xml:space="preserve">(softmax :axis n</text>
<rect x="88" y="312" width="288" height="228" rx="4" fill="#fff0e5" stroke="#d99870" data-kernel="add"/>
<text x="104" y="344" class="ir" text-anchor="start" xml:space="preserve">(+</text>
<rect x="104" y="364" width="256" height="100" rx="4" fill="#eef2f8" stroke="#8da3c0" data-kernel="matmul"/>
<text x="120" y="400" class="ir" text-anchor="start" xml:space="preserve">(@ (load A_m)</text>
<text x="120" y="432" class="ir" text-anchor="start" xml:space="preserve">   (load B))</text>
<text x="104" y="506" class="ir" text-anchor="start" xml:space="preserve">  (load bias))</text>
<text x="88" y="566" class="ir" text-anchor="start" xml:space="preserve">)</text>
<text x="64" y="624" class="ir" text-anchor="start" xml:space="preserve">  ))</text>
<line x1="56" y1="674" x2="400" y2="674" stroke="#bfc0c0"/>
<text x="64" y="716" class="code" text-anchor="start" xml:space="preserve">A_m  = A[m:m+16, 0:K]</text>
<text x="64" y="746" class="code" text-anchor="start" xml:space="preserve">B    = B[0:K, 0:N]</text>
<text x="64" y="776" class="code" text-anchor="start" xml:space="preserve">bias = bias[0:N]</text>
<text x="64" y="806" class="code" text-anchor="start" xml:space="preserve">Y_m  = Y[m:m+16, 0:N]</text>
<text x="64" y="880" class="small" text-anchor="start" xml:space="preserve">N = 128 · 한 행 전체를 같은 CTA에 배치</text>
<text x="64" y="910" class="note" text-anchor="start" xml:space="preserve">중간 타일: FP32 · Register</text>
<text x="64" y="940" class="note" text-anchor="start" xml:space="preserve">softmax 축: n</text>
<text x="520" y="136" class="name" text-anchor="start" xml:space="preserve">Native Kernels</text>
<rect x="512" y="160" width="392" height="256" rx="4" fill="#eef2f8" stroke="#8da3c0" data-kernel="matmul"/>
<text x="528" y="192" class="name" text-anchor="start" xml:space="preserve">Matmul Kernel</text>
<text x="888" y="192" class="code" text-anchor="end" xml:space="preserve">@</text>
<text x="528" y="224" class="note" text-anchor="start" xml:space="preserve">prologue</text>
<text x="528" y="250" class="code" text-anchor="start" xml:space="preserve">auto acc = zeros&lt;16, N&gt;();</text>
<text x="528" y="288" class="note" text-anchor="start" xml:space="preserve">mainloop</text>
<text x="528" y="314" class="code" text-anchor="start" xml:space="preserve">mma_and_wait(acc, A_mk, B_kn);</text>
<text x="528" y="352" class="note" text-anchor="start" xml:space="preserve">epilogue</text>
<text x="528" y="378" class="code" text-anchor="start" xml:space="preserve">auto out = result_tile(acc);</text>
<rect x="512" y="440" width="392" height="232" rx="4" fill="#fff0e5" stroke="#d99870" data-kernel="add"/>
<text x="528" y="472" class="name" text-anchor="start" xml:space="preserve">Add Kernel</text>
<text x="888" y="472" class="code" text-anchor="end" xml:space="preserve">+</text>
<text x="528" y="504" class="note" text-anchor="start" xml:space="preserve">prologue</text>
<text x="528" y="530" class="code" text-anchor="start" xml:space="preserve">auto b = load_tile(bias);</text>
<text x="528" y="568" class="note" text-anchor="start" xml:space="preserve">mainloop</text>
<text x="632" y="568" class="code" text-anchor="start" xml:space="preserve">None</text>
<text x="528" y="608" class="note" text-anchor="start" xml:space="preserve">epilogue</text>
<text x="528" y="634" class="code" text-anchor="start" xml:space="preserve">auto out = input + b;</text>
<rect x="512" y="696" width="392" height="368" rx="4" fill="#eaf1eb" stroke="#8aa28f" data-kernel="softmax"/>
<text x="528" y="728" class="name" text-anchor="start" xml:space="preserve">Softmax Kernel</text>
<text x="888" y="728" class="code" text-anchor="end" xml:space="preserve">softmax</text>
<text x="528" y="760" class="note" text-anchor="start" xml:space="preserve">prologue</text>
<text x="528" y="786" class="code" text-anchor="start" xml:space="preserve">auto rows = prepare_row_reduce();</text>
<text x="528" y="826" class="note" text-anchor="start" xml:space="preserve">mainloop</text>
<text x="632" y="826" class="code" text-anchor="start" xml:space="preserve">None</text>
<text x="528" y="866" class="note" text-anchor="start" xml:space="preserve">epilogue</text>
<text x="528" y="896" class="code" text-anchor="start" xml:space="preserve">auto hi = row_max(rows, input);</text>
<text x="528" y="924" class="code" text-anchor="start" xml:space="preserve">auto e = exp(input - hi);</text>
<text x="528" y="952" class="code" text-anchor="start" xml:space="preserve">auto sum = row_sum(rows, e);</text>
<text x="528" y="980" class="code" text-anchor="start" xml:space="preserve">auto out = e / sum;</text>
<rect x="1164" y="158" width="564" height="62" rx="4" fill="#eef2f8" stroke="none" data-kernel="matmul"/>
<rect x="1164" y="248" width="564" height="62" rx="4" fill="#fff0e5" stroke="none" data-kernel="add"/>
<rect x="1164" y="338" width="564" height="62" rx="4" fill="#eaf1eb" stroke="none" data-kernel="softmax"/>
<rect x="1180" y="458" width="548" height="62" rx="4" fill="#eef2f8" stroke="none" data-kernel="matmul"/>
<rect x="1164" y="578" width="564" height="62" rx="4" fill="#eef2f8" stroke="none" data-kernel="matmul"/>
<rect x="1164" y="668" width="564" height="62" rx="4" fill="#fff0e5" stroke="none" data-kernel="add"/>
<rect x="1164" y="758" width="564" height="152" rx="4" fill="#eaf1eb" stroke="none" data-kernel="softmax"/>
<text x="1152" y="148" class="code" text-anchor="start" xml:space="preserve">for (auto m : row_tiles(M, 16)) {</text>
<text x="1152" y="178" class="comment" text-anchor="start" xml:space="preserve">  // Matmul.prologue</text>
<text x="1152" y="208" class="code" text-anchor="start" xml:space="preserve">  auto acc = zeros&lt;16, N&gt;();</text>
<text x="1152" y="238" class="code" text-anchor="start" xml:space="preserve"></text>
<text x="1152" y="268" class="comment" text-anchor="start" xml:space="preserve">  // Add.prologue</text>
<text x="1152" y="298" class="code" text-anchor="start" xml:space="preserve">  auto b = load_tile(bias);</text>
<text x="1152" y="328" class="code" text-anchor="start" xml:space="preserve"></text>
<text x="1152" y="358" class="comment" text-anchor="start" xml:space="preserve">  // Softmax.prologue</text>
<text x="1152" y="388" class="code" text-anchor="start" xml:space="preserve">  auto rows = prepare_row_reduce();</text>
<text x="1152" y="418" class="code" text-anchor="start" xml:space="preserve"></text>
<text x="1152" y="448" class="code" text-anchor="start" xml:space="preserve">  for (int k = 0; k &lt; K; k += 64) {</text>
<text x="1152" y="478" class="comment" text-anchor="start" xml:space="preserve">    // Matmul.mainloop</text>
<text x="1152" y="508" class="code" text-anchor="start" xml:space="preserve">    mma_and_wait(acc, A_mk, B_kn);</text>
<text x="1152" y="538" class="code" text-anchor="start" xml:space="preserve">  }</text>
<text x="1152" y="568" class="code" text-anchor="start" xml:space="preserve"></text>
<text x="1152" y="598" class="comment" text-anchor="start" xml:space="preserve">  // Matmul.epilogue</text>
<text x="1152" y="628" class="code" text-anchor="start" xml:space="preserve">  auto x = result_tile(acc);</text>
<text x="1152" y="658" class="code" text-anchor="start" xml:space="preserve"></text>
<text x="1152" y="688" class="comment" text-anchor="start" xml:space="preserve">  // Add.epilogue</text>
<text x="1152" y="718" class="code" text-anchor="start" xml:space="preserve">  auto z = x + b;</text>
<text x="1152" y="748" class="code" text-anchor="start" xml:space="preserve"></text>
<text x="1152" y="778" class="comment" text-anchor="start" xml:space="preserve">  // Softmax.epilogue</text>
<text x="1152" y="808" class="code" text-anchor="start" xml:space="preserve">  auto hi = row_max(rows, z);</text>
<text x="1152" y="838" class="code" text-anchor="start" xml:space="preserve">  auto e = exp(z - hi);</text>
<text x="1152" y="868" class="code" text-anchor="start" xml:space="preserve">  auto sum = row_sum(rows, e);</text>
<text x="1152" y="898" class="code" text-anchor="start" xml:space="preserve">  auto y = e / sum;</text>
<text x="1152" y="928" class="code" text-anchor="start" xml:space="preserve"></text>
<text x="1152" y="958" class="code" text-anchor="start" xml:space="preserve">  store_tile(Y_m, bf16(y));</text>
<text x="1152" y="988" class="code" text-anchor="start" xml:space="preserve">}</text>

<text x="1708" y="718" class="small" text-anchor="end" xml:space="preserve">Add.in ← x</text>
<text x="1708" y="808" class="small" text-anchor="end" xml:space="preserve">Softmax.in ← z</text>

<figcaption>설계 의사코드입니다. softmax를 포함한 fused expression과 연산자별 Kernel 분해는 현재 IR 파서·Provider의 지원 완료를 뜻하지 않습니다. 각 CTA가 N=128인 행 전체를 소유하고 세 구현의 타일 layout이 호환된다고 가정합니다. 중간 타일은 FP32 Register이며, row_max·row_sum은 같은 행에 속한 thread 간 reduction과 broadcast를 포함합니다. 독립적인 준비 코드는 K 반복 전에 배치하고 결과 타일은 x → z → y로 연결합니다. CUDA helper는 타일 접근·경계 처리·필요한 동기화를 축약한 표기입니다.</figcaption>
