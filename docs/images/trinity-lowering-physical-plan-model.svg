<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1424 1008" role="img" aria-labelledby="trinity-lowering-physical-plan-model-title trinity-lowering-physical-plan-model-desc">
<title id="trinity-lowering-physical-plan-model-title">PhysicalPlan</title>
<desc id="trinity-lowering-physical-plan-model-desc">PhysicalPlan의 입출력, 실행 순서와 텐서 값을 A 더하기 B로 sum_ab를 만들고 sum_ab 곱하기 B로 Y를 만드는 예시로 연결한다. statements는 operations를 참조하고 두 연산이 참조하는 중간 값 v2만 연결선으로 강조한다. 오른쪽 위의 축약 IR에서 seq는 statements로, 두 store는 각각의 Operation으로 연결된다. 중간 값 v2를 확대한 ValueInstance와 GPU 텐서 sum_ab를 오른쪽 아래에 표시한다.</desc>
